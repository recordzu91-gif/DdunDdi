services:
  - type: web
    name: study-together
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true


